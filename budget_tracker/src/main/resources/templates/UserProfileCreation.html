<!DOCTYPE html>
<html>
<head>
<title>Layout</title>

<style>
body{
    margin:0;
    height:100vh;
    font-family:Arial, Helvetica, sans-serif;
}

/* layout */
.container{
    display:flex;
    height:100vh;
}

/* LEFT SIDE (ORANGE) */
.left{
    width:22%;
    padding:30px;
    color:white;

    background: linear-gradient(180deg,#ff7a18,#ff512f);
}

/* menu links */
.left a{
    display:block;
    padding:12px;
    margin:15px 0;
    border-radius:8px;
    color:white;
    text-decoration:none;
}

.left a:hover{
    background: rgba(255,255,255,0.2);
}

/* RIGHT SIDE (PURPLE/BLUE GRADIENT) */
.right{
    width:78%;
    display:flex;
    justify-content:center;
    align-items:center;

    background: linear-gradient(120deg,#667eea,#764ba2);
}

/* GLASS CARD */
form{
    width:360px;
    padding:40px;
    border-radius:18px;

    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(20px);

    border:1px solid rgba(255,255,255,0.25);
    box-shadow:0 20px 40px rgba(0,0,0,0.3);
}

/* title */
form h3{
    color:white;
    text-align:center;
}

/* inputs */
input, select{
    width:100%;
    padding:12px;
    margin:12px 0;
    border:none;
    border-radius:8px;
}

/* buttons */
input[type="submit"]{
    background:#ff7a18;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

input[type="reset"]{
    background:#ddd;
    cursor:pointer;
}
</style>

</head>

<body>

<div class="container">

    <!-- LEFT SIDE -->
    <div class="left">

        <h3>Menu</h3>


        <div class="back-btn">
            <a href="/controller/myProfile">View User Profile</a>
        </div>


        <div class="back-btn">
            <a href="/controller/budgetApp">Back to Main Menu</a>
        </div>

        
        <div class="back-btn">
            <a href="/controller2/password">Set password</a>
        </div>

        <div class="back-btn">
            <a href="/controller2/role">Set Role</a>
        </div>

       <a href="/logout">Logout</a>


    </div>





    <!-- RIGHT SIDE -->
    <div class="right">

  

        <form action="saveUserProfile" method="post" enctype="multipart/form-data">

            <h3>User Profile</h3>

            <input type="text" name="username" placeholder="user name" required><br><br>

            <input type="file" name="imageFile" required><br><br>

            <input type="number" name="monthlySavingsGoal" placeholder="monthly Goal Amount" required><br><br>

            <input type="submit" value="save">
            <input type="reset" value="clear">

        </form>

    </div>

</div>

</body>
</html>
