<html>
<head>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #1a1a1a; 
        color: white;
        padding: 40px;
    }

    /* Table Styling */
    table {
        width: 100%;
        border-collapse: collapse;
        background-color: #2c2c2c;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
        margin-bottom: 30px; /* Space after each table */
    }

    th, td {
        padding: 15px;
        text-align: left;
        border-bottom: 1px solid #444;
    }

    th {
        background-color: #ff4500; 
        color: white;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    tr:hover {
        background-color: #3d3d3d; 
    }

    /* Header Colors */
    .expense-header { color: #ff4500; }
    .income-header { color: #4caf50; }

    /* Amount Column Styling */
    .income-amount {
        font-weight: bold;
        color: #4caf50;
    }

    .expense-amount {
        font-weight: bold;
        color: #ff4500;
    }



    /* div 2 back button */

.back-btn {
    margin-top: 20px;
}

.back-btn a {
    text-decoration: none;
    padding: 10px 20px;
    color: white;
    font-weight: 500;
    border-radius: 10px;

    /* Orange glass effect */
    background: rgba(255, 102, 0, 0.35);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    border: 1px solid rgba(255, 165, 0, 0.5);
    box-shadow: 0 8px 32px rgba(255, 102, 0, 0.4);

    transition: all 0.3s ease;
}

.back-btn a:hover {
    background: rgba(255, 102, 0, 0.6);
    transform: scale(1.05);
}
</style>    
</head>    

<body>

    <h2 class="expense-header">EXPENSE TRANSACTIONS</h2>
    <table border="1">
        <thead>
            <tr>
                <th>Amount</th>
                <th>Transaction Type</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${partitionedData[false]}">
                <td class="expense-amount" th:text="${p.amount}"></td> 
                <td th:text="${p?.type}"></td>
            </tr>
        </tbody>
    </table> 

    <h2 class="income-header">INCOME TRANSACTIONS</h2>
    <table border="1">
        <thead>
            <tr>
                <th>Amount</th>
                <th>Transaction Type</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${partitionedData[true]}">
                <td class="income-amount" th:text="${p.amount}"></td> 
                <td th:text="${p.type}"></td>
            </tr>
        </tbody>

</table>




        
<h2 class="income-header">Category Transactions</h2>
    <table>
        <thead>
            <tr><th>Category</th><th>Total Amount</th></tr>
        </thead>
        <tbody>
            <tr th:each="entry : ${spendingByCategory}">
                <td class="income-amount" th:text="${entry.key}"></td> 
                <td th:text="${entry.value}"></td>
            </tr>
        </tbody>
    </table>

<div class="back-btn">
<a href = "/controller/budgetApp"> Back to Main Menu </a>
<div>

</body>
</html>
