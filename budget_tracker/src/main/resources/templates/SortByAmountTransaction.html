<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a; 
            color: white;
            padding: 40px;
        }

        /* Fire Effect Heading */
        .fire-text {
            font-size: 35px;
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
            color: #ffd700;
            margin-bottom: 30px;
            text-shadow: 0 0 4px #fff, 0 -5px 4px #ff3, 2px -10px 6px #f90, -2px -15px 11px #f60, 2px -25px 18px #f30;
            animation: burn 1.5s infinite alternate;
        }

        @keyframes burn {
            0% { text-shadow: 0 0 4px #fff, 0 -5px 4px #ff3, 2px -10px 6px #f90, -2px -15px 11px #f60, 2px -25px 18px #f30; }
            100% { text-shadow: 0 0 6px #fff, 0 -8px 8px #ff3, 4px -15px 10px #f90, -4px -20px 15px #f60, 4px -30px 25px #f30; }
        }

        /* Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #2c2c2c;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #444;
        }

        th {
            background-color: #ff4500; 
            color: white;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        tr:hover {
            background-color: #3d3d3d; 
        }

        /* Amount Column Styling */
        .amount-cell {
            font-weight: bold;
            color: #4caf50;
    </style>
</head>

<body>

    <h3 class="fire-text">All Transactions Sort By Amount </h3>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Date</th>
                <th>Description</th>
                <th>Amount</th>
                <th>Category</th>
                <th>Type</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="t : ${transactions}">
                <td th:text="${t.id}"></td>
                <td th:text="${t.date}"></td>
                <td th:text="${t.description}"></td>
                <td class="amount-cell" th:text="${t.amount}"></td>
                <td th:text="${t.categoryName}"></td>
                <td th:text="${t.type}"></td>
            </tr>
        </tbody>
    </table>

</body>
</html>
