<html>
<head>
<style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a; 
            color: white;
            padding: 40px;
        }



        /* Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #2c2c2c;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #444;
        }

        th {
            background-color: #ff4500; 
            color: white;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        tr:hover {
            background-color: #3d3d3d; 
        }

        /* Amount Column Styling */
        .amount-cell {
            font-weight: bold;
            color: #4caf50;
        }






/* div 2 back button */

.back-btn {
    margin-top: 20px;
}

.back-btn a {
    text-decoration: none;
    padding: 10px 20px;
    color: white;
    font-weight: 500;
    border-radius: 10px;

    /* Orange glass effect */
    background: rgba(255, 102, 0, 0.35);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    border: 1px solid rgba(255, 165, 0, 0.5);
    box-shadow: 0 8px 32px rgba(255, 102, 0, 0.4);

    transition: all 0.3s ease;
}

.back-btn a:hover {
    background: rgba(255, 102, 0, 0.6);
    transform: scale(1.05);
}

</style>

</head>
<body>

<table border="1">
    <thead>
        <tr>
            <th>Id</th>
            <th>Date</th>
            <th>Description</th>
            <th>Amount</th>
            <th>Category</th>
            <th>Transaction Type</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="t : ${transactionByDate}">
            <td th:text="${t.id}"></td>
            <td th:text="${t.date}"></td>
            <td th:text="${t.description}"></td>
            <td th:text="${t.amount}"></td>
            <td th:text="${t.category.categoryName}"></td>
            <td th:text="${t.type}"></td>
        </tr>
    </tbody>
</table>

<div class="back-btn">
<a href = "/controller/budgetApp"> Back to Main Menu </a>
<div>

</body>
</html>
