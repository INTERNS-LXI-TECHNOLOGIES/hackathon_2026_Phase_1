<html>
<head>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: Arial, Helvetica, sans-serif;
}

body{
background: linear-gradient(135deg,#7829e0,#f8cdda);
min-height:100vh;
padding:40px;
}

/* Grid container */
.profile-container{
display:grid;
grid-template-columns: repeat(5, 1fr);
gap:25px;
}

/* Glass card */
.profile-card{
background: rgba(255,255,255,0.15);
backdrop-filter: blur(10px);
-webkit-backdrop-filter: blur(10px);

border-radius:15px;
border:1px solid rgba(255,255,255,0.3);
box-shadow:0 8px 32px rgba(0,0,0,0.3);

padding:20px;
text-align:center;
color:white;
transition:0.3s;
}

/* Hover effect */
.profile-card:hover{
transform:scale(1.05);
}

/* Profile image */
.profile-card img{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
border:4px solid white;
margin-bottom:10px;
}

</style>

</head>

<body>

<div class="profile-container">

<div class="profile-card" th:each="p : ${allUserProfile}">

<img th:src="${p.profilePicture}" alt="Profile Picture">

<h3 th:text="${p.username}"></h3>

<p>Goal: ₹ <span th:text="${p.monthlySavingsGoal}"></span></p>

</div>

</div>

</body>
</html>
