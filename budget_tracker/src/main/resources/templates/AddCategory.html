<html>
<head>
 <style>
body {
  /* A vibrant background makes the glass effect stand out */
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.form-container {
  /* The core Glassmorphism properties */
  background: rgba(255, 255, 255, 0.15); /* Semi-transparent white */
  backdrop-filter: blur(12px); /* This creates the frosted effect */
  -webkit-backdrop-filter: blur(12px); /* Support for Safari */
  
  border-radius: 16px;
  border: 1px solid rgba(255, 255, 255, 0.2); /* Subtle white border */
  padding: 40px;
  box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
  width: 320px;
}

form {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

input[type="text"], 
input[type="number"] {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 8px;
  padding: 12px;
  color: white;
  outline: none;
}

input::placeholder {
  color: rgba(255, 255, 255, 0.7);
}

input[type="submit"], 
input[type="reset"] {
  padding: 10px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  transition: 0.3s;
}

input[type="submit"] {
  background: #4facfe;
  color: white;
}

input[type="submit"]:hover {
  background: #00f2fe;
  transform: translateY(-2px);
}

input[type="reset"] {
  background: rgba(255, 255, 255, 0.2);
  color: white;
}

input[type="reset"]:hover {
  background: rgba(255, 255, 255, 0.3);
}



/* div 2 back button */

.back-btn {
    margin-top: 20px;
}

.back-btn a {
    text-decoration: none;
    padding: 10px 20px;
    color: white;
    font-weight: 500;
    border-radius: 10px;

    /* Orange glass effect */
    background: rgba(255, 102, 0, 0.35);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    border: 1px solid rgba(255, 165, 0, 0.5);
    box-shadow: 0 8px 32px rgba(255, 102, 0, 0.4);

    transition: all 0.3s ease;
}

.back-btn a:hover {
    background: rgba(255, 102, 0, 0.6);
    transform: scale(1.05);
} 
 </style>

</head>   

<body>

 <dive class = "form-container">
<h3>Welcome to category Add Area <h3>

 <form action ="/controller/addCategory" method = "post">


<input type = "text"  name = "categoryName" placeholder="category name" />
<input type = "number" name = "budgetLimit" placeholder="budgetLimit set" />

<input type = "submit" value = "Save" />

<input type = "reset" value = "Clear" />
 </form>
 
</div>

<div class="back-btn">
<a href = "/controller/budgetApp"> Back to Main Menu </a>
</div>
</body>
</html>
