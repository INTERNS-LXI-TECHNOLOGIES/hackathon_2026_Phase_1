<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Summary Count</title>

    <style>
body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a; 
            color: white;
            padding: 40px;
        }



        /* Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #2c2c2c;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #444;
        }

        th {
            background-color: #ff4500; 
            color: white;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        tr:hover {
            background-color: #3d3d3d; 
        }

        /* Amount Column Styling */
        .amount-cell {
            font-weight: bold;
            color: #4caf50;
        }
     </style>   
</head>
<body>

    <table border="1">
        <thead>
            <tr>
                <th>Count</th>
                <th>Sum</th>
                <th>Average</th>
                <th>Min</th>
                <th>Max</th>
            </tr>
        </thead>
        <tbody>

                <td th:text="${doubleSummaryCount}"></td>
                <td th:text="${doubleSummaryMin}"></td>
                <td th:text="${doubleSummaryAverage}"></td>
                <td th:text="${doubleSummaryMax}"></td>
                <td th:text="${doubleSummarySum}"></td>
                
            </tr>
        </tbody>
    </table>

</body>
</html>
