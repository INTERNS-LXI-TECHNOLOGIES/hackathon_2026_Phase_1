<html>
<head>

<style>

body{
    margin:0;
    padding:0;
    font-family: Consolas, monospace;
    background: radial-gradient(circle at center,#020024,#000000);
    color:#00ffea;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

/* Animated grid background */

body::before{
    content:"";
    position:absolute;
    width:200%;
    height:200%;
    background-image:
        linear-gradient(#00fff2 1px, transparent 1px),
        linear-gradient(90deg,#00fff2 1px, transparent 1px);
    background-size:60px 60px;
    opacity:0.08;
    animation: gridMove 20s linear infinite;
}

@keyframes gridMove{
    from{transform:translateY(0);}
    to{transform:translateY(60px);}
}

.container{
    position:relative;
    background:rgba(0,0,0,0.7);
    padding:50px;
    border-radius:10px;
    text-align:center;
    border:1px solid #00fff2;
    box-shadow:0 0 25px #00fff2;
}

h2{
    font-size:32px;
    letter-spacing:3px;
    text-shadow:0 0 10px #00fff2,0 0 25px #00fff2;
    margin-bottom:35px;
}

/* hologram button */

a{
    display:inline-block;
    padding:15px 30px;
    text-decoration:none;
    color:#00fff2;
    border:1px solid #00fff2;
    border-radius:5px;
    font-size:16px;
    letter-spacing:2px;
    transition:0.4s;
    box-shadow:0 0 10px #00fff2 inset;
}

a:hover{
    background:#00fff2;
    color:black;
    box-shadow:
        0 0 10px #00fff2,
        0 0 30px #00fff2,
        0 0 60px #00fff2;
    transform:scale(1.08);
}

</style>

</head>

<body>

<div class="container">

<h2>ADMIN CONTROL PANEL</h2>

<div>

<a href="">VIEW USERS PASSWORD</a>

<a href="/controller/viewAllUserProfile">VIEW All User Profile</a>

</div>

</div>

</body>
</html>
