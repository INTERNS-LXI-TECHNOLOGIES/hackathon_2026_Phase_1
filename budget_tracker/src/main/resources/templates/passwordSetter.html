<html>
<head>
<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, Helvetica, sans-serif;

    background: linear-gradient(120deg,#4facfe,#00f2fe);
}

form{
    background:white;
    padding:40px;
    border-radius:10px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    display:flex;
    flex-direction:column;
    gap:15px;
    width:300px;
}

input[type="text"]{
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:14px;
}

input[type="text"]:focus{
    outline:none;
    border-color:#4facfe;
}

input[type="submit"]{
    padding:12px;
    border:none;
    background:#4facfe;
    color:white;
    font-size:15px;
    border-radius:6px;
    cursor:pointer;
}

input[type="submit"]:hover{
    background:#2d8cf0;
}

input[type="reset"]{
    padding:12px;
    border:none;
    background:#ff6b6b;
    color:white;
    font-size:15px;
    border-radius:6px;
    cursor:pointer;
}

input[type="reset"]:hover{
    background:#e04848;
}
</style>
</head>    

<body>

<form action ="/controller2/passwordSetter" method ="post">


<input type ="text" name = "username" placeholder="username" required>

<input type ="text" name = "password" placeholder="password" required>

<input type="submit" value = "set password" >

<input type ="reset" value = "clear">



</form>    


</body>
</html>
