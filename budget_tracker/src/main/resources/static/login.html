<!DOCTYPE html>
<html>
<head>
<style>
/* Instagram-style login for Budget Tracker */
body {
    background-color: #fafafa;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    height: 100vh;
    margin: 0;
}

form {
    background-color: #ffffff;
    border: 1px solid #dbdbdb;
    padding: 20px 40px;
    width: 350px;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    text-align: center;
}

form::before {
    content: 'Budget Tracker';
    font-size: 2rem;
    margin: 20px 0 30px 0;
    font-weight: 600;
    color: #262626;
    display: block;
}

input {
    width: 100%;
    padding: 9px 8px;
    margin-bottom: 6px;
    background: #fafafa;
    border: 1px solid #dbdbdb;
    border-radius: 3px;
    box-sizing: border-box;
    font-size: 12px;
}

input:focus {
    border-color: #a8a8a8;
    outline: none;
}

button {
    width: 100%;
    background-color: #0095f6;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 7px 0;
    font-weight: 600;
    font-size: 14px;
    margin-top: 10px;
    cursor: pointer;
    transition: background-color 0.2s;
}

button:hover {
    background-color: #1877f2;
}
</style>    
</head>    

<body>

<form action="/login" method="post">

    <input type="text" name="username" placeholder="Username" required>

    <input type="password" name="password" placeholder="Password" required>

    <button type="submit">Login</button>

</form>

<div class="signup-link" style="margin-top: 10px; background-color: white; border: 1px solid #dbdbdb; width: 350px; padding: 20px; text-align: center; font-size: 14px; box-sizing: border-box;">
    Don't have an account? <a href="/register.html" style="color: #0095f6; text-decoration: none; font-weight: 600;">Sign up</a>
</div>

</body>
</html>
