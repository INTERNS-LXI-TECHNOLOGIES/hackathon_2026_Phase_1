<html>
    <form method="post" action="/api/registercontroller/register">
<style>

/* Background with light dark overlay */
body{
    font-family:"Segoe UI", Arial;
    margin:0;
    height:100vh;

    background-image:
    linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
    url("https://images.unsplash.com/photo-1522202176988-66273c2fd55f");

    background-size:cover;
    background-position:center;

    display:flex;
    justify-content:center;
    align-items:center;
}

/* Transparent glass form */
form{
    width:320px;
    padding:35px;

    background:rgba(255,255,255,0.08); /* transparent */
    backdrop-filter: blur(12px);

    border-radius:12px;

    box-shadow:
    0 0 15px rgba(0,255,255,0.35);

    color:white;
}

/* Labels */
label{
    display:block;
    margin-top:12px;
}

/* Inputs */
input{
    width:100%;
    padding:10px;
    margin-top:8px;

    border-radius:6px;
    border:1px solid rgba(255,255,255,0.3);

    background:rgba(255,255,255,0.1);
    color:white;
}

/* Neon focus */
input:focus{
    outline:none;
    border-color:#38bdf8;
    box-shadow:0 0 8px #38bdf8;
}

/* Button */
button{
    width:100%;
    padding:10px;
    margin-top:18px;

    border:none;
    border-radius:6px;

    background:linear-gradient(45deg,#3b82f6,#06b6d4);
    color:white;

    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
    box-shadow:0 0 15px #38bdf8;
}

/* Back link */
a{
    display:block;
    text-align:center;
    margin-top:15px;

    color:#38bdf8;
    text-decoration:none;
}

a:hover{
    text-shadow:0 0 10px #38bdf8;
}

</style>
<label>Username</label>
<input type="text" name="username">

<label>Password</label>
<input type="password" name="password">



<button type="submit">Register</button>
<a href="/login.html">BackToLoginPage</a>
</form>
</html>
