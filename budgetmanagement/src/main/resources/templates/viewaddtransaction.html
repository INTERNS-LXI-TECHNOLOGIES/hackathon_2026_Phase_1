<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<title>Transactions</title>

<style>

/* Page background */
body{
    font-family:"Segoe UI", Arial;
    margin:0;
    padding:40px;
    background:linear-gradient(135deg,#020617,#0f172a);
    color:white;
}

/* Title */
h1{
    text-align:center;
    font-size:34px;
    margin-bottom:30px;
    color:#38bdf8;
    text-shadow:0 0 8px #38bdf8;
}

/* Language selector */
form{
    text-align:right;
    margin-bottom:20px;
}

select{
    padding:6px;
    border-radius:6px;
    border:1px solid #38bdf8;
    background:#020617;
    color:white;
}

/* Table styling */
table{
    width:80%;
    margin:auto;
    border-collapse:collapse;
    backdrop-filter:blur(8px);
    box-shadow:0 0 15px rgba(0,255,255,0.3);
}

/* Table headers */
th{
    padding:12px;
    background:#020617;
    border:1px solid #38bdf8;
    color:#38bdf8;
    text-shadow:0 0 6px #38bdf8;
}

/* Table cells */
td{
    padding:10px;
    border:1px solid #334155;
    background:rgba(0,0,0,0.5);
}

/* Hover row effect */
tr:hover td{
    background:#020617;
    box-shadow:0 0 10px #38bdf8 inset;
}

/* Back button */
a{
    display:block;
    width:180px;
    margin:30px auto;
    text-align:center;
    padding:10px;
    border-radius:25px;
    border:2px solid #38bdf8;
    color:#38bdf8;
    text-decoration:none;
    font-weight:bold;
    box-shadow:0 0 8px #38bdf8;
    transition:0.3s;
}

a:hover{
    background:#38bdf8;
    color:black;
    box-shadow:0 0 18px #38bdf8;
}

</style>

</head>

<body>

<!-- Language selector -->
<form method="get" action="/api/transaction/viewaddtransaction">
<select name="lang" onchange="this.form.submit()">
<option value="en" th:selected="${#locale.language == 'en'}">English</option>
<option value="ml" th:selected="${#locale.language == 'ml'}">Malayalam</option>
<option value="hi" th:selected="${#locale.language == 'hi'}">Hindi</option>
</select>
</form>

<h1 th:text="#{page.transactions.title}"></h1>

<table border="1">

<tr>
<th th:text="#{table.id}"></th>
<th th:text="#{table.description}"></th>
<th th:text="#{table.amount}"></th>
<th th:text="#{table.category}"></th>
<th th:text="#{table.date}"></th>
<th th:text="#{table.type}"></th>
</tr>

<tr th:each="t : ${transactions}">

<td th:text="${t.id}"></td>

<td th:text="#{${#strings.replace(t.description,' ','_')}}"></td>

<td th:text="${t.amount}"></td>

<td th:text="#{${t.categoryName}}"></td>

<td th:text="${t.date}"></td>

<td th:text="#{${t.type}}"></td>

</tr>

</table>

<br>

<a href="/api/transaction/homepage" th:text="#{button.back_home}"></a>

</body>
</html>
