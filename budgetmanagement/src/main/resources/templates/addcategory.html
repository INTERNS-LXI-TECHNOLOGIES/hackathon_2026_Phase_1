<!DOCTYPE html>
<html>
<head>
<title>Add Category</title>

<style>

/* Background collage */
body{
    margin:0;
    font-family: "Segoe UI", Arial, sans-serif;
    height:100vh;

   background-image: linear-gradient(rgba(0,0,0,0.65),rgba(0,0,0,0.65)), url("https://images.unsplash.com/photo-1556740738-b6a63e27c4df");
    background-size:cover;
    background-position:center;

    display:flex;
    justify-content:center;
    align-items:center;
}

/* Form card */
.container{
    background:rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    padding:40px;
    border-radius:12px;
    width:380px;
    box-shadow:0 8px 30px rgba(0,0,0,0.5);
    color:white;
}

/* Title */
h1{
    text-align:center;
    margin-bottom:30px;
}

/* Label */
label{
    display:block;
    margin-bottom:6px;
    font-weight:600;
}

/* Inputs */
input{
    width:100%;
    padding:10px;
    border-radius:6px;
    border:1px solid rgba(255,255,255,0.3);
    background:rgba(255,255,255,0.1);
    color:white;
    margin-bottom:20px;
}

/* Focus effect */
input:focus{
    outline:none;
    border-color:#4fc3f7;
    box-shadow:0 0 8px #4fc3f7;
}

/* Button */
button{
    width:100%;
    padding:10px;
    border:none;
    border-radius:6px;
    background:linear-gradient(45deg,#2196f3,#00bcd4);
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
    box-shadow:0 0 15px #00bcd4;
}

/* Links */
.links{
    margin-top:20px;
    text-align:center;
}

.links a{
    color:#4fc3f7;
    text-decoration:none;
    margin:0 10px;
}

.links a:hover{
    text-decoration:underline;
}

</style>

</head>

<body>

<div class="container">

<h1>Add Category</h1>

<form action="/api/category/addcategoryitem" method="post">

<label>Name</label>
<input type="text" name="name">

<label>Limit</label>
<input type="text" name="limitStr">

<button type="submit">Add Category</button>

</form>

<div class="links">
<a href="/api/transaction/homepage">Back to Home</a>
<a href="/api/category/viewaddcategory">View Category</a>
</div>

</div>

</body>
</html>
