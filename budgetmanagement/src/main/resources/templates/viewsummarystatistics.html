<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


<head>
<title>Advanced Financial Insights</title>

<style>

/* Page background */
body{
    font-family:"Segoe UI", Arial;
    margin:0;
    padding:40px;
    background:linear-gradient(135deg,#020617,#0f172a);
    color:white;
}

/* Main title */
h1{
    text-align:center;
    font-size:36px;
    color:#00f2ff;
    text-shadow:0 0 10px #00f2ff;
}

/* Section headings */
h2{
    color:#38bdf8;
    text-shadow:0 0 6px #38bdf8;
    margin-top:30px;
}

/* Statistic text */
p{
    font-size:16px;
    padding:6px;
}

/* Highlight values */
span{
    color:#22c55e;
    font-weight:bold;
    text-shadow:0 0 6px #22c55e;
}

/* Insight boxes */
div{
    background:rgba(0,0,0,0.4);
    padding:15px;
    border-radius:8px;
    box-shadow:0 0 12px rgba(0,255,255,0.2);
    margin-top:10px;
}

/* Category report */
pre{
    background:rgba(0,0,0,0.5);
    padding:15px;
    border-radius:8px;
    border:1px solid #00f2ff;
    box-shadow:0 0 10px #00f2ff inset;
}

/* Divider */
hr{
    border:1px solid #1e293b;
    margin:30px 0;
}

/* Neon button */
a{
    display:inline-block;
    margin-top:20px;
    padding:10px 18px;
    border-radius:25px;
    border:2px solid #00f2ff;
    color:#00f2ff;
    text-decoration:none;
    font-weight:bold;
    box-shadow:0 0 10px #00f2ff;
    transition:0.3s;
}

a:hover{
    background:#00f2ff;
    color:black;
    box-shadow:0 0 20px #00f2ff;
}

</style>
</head>
<body>

<h1>Advanced Financial Insights</h1>

<hr>

<h2>Expense Statistics</h2>

<p>Total Expenses: <span th:text="${total}"></span></p>
<p>Average Expense: <span th:text="${average}"></span></p>
<p>Max Expense: <span th:text="${max}"></span></p>
<p>Min Expense: <span th:text="${min}"></span></p>
<p>Transaction Count: <span th:text="${count}"></span></p>

<hr>

<h2>Highest Expense</h2>

<div th:if="${highExpense != null}">
    <p>Amount: <span th:text="${highExpense.amount}"></span></p>
    <p>Category: <span th:text="${highExpense.categoryName}"></span></p>
    <p>Type: <span th:text="${highExpense.type}"></span></p>
</div>

<div th:if="${highExpense == null}">
    <p>No expense transactions found</p>
</div>

<hr>

<h2>Category Report</h2>

<pre th:text="${categoryReport}"></pre>
<a href="/api/analytics/analyticspage">Back to Home</a>
</body>
</html>
