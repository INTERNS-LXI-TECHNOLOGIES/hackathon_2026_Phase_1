<!DOCTYPE html>
<html>
<head>
<title>Budget App Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: "Segoe UI", sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background: linear-gradient(-45deg,#1d4350,#a43931,#16222a,#3a6073);
background-size:400% 400%;
animation: gradientMove 10s ease infinite;
}

@keyframes gradientMove{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

/* PROFESSIONAL GLASS BOX */

.login-box{
width:380px;
padding:45px;
border-radius:18px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,0.2);
box-shadow:0 20px 40px rgba(0,0,0,0.4);
color:white;
}

.login-box h2{
text-align:center;
margin-bottom:30px;
letter-spacing:1px;
}

.input-group{
margin-bottom:20px;
}

.input-group label{
font-size:14px;
font-weight:600;
}

.input-group input{
width:100%;
padding:12px;
margin-top:6px;
border:none;
border-radius:8px;
outline:none;
font-size:14px;
background:rgba(255,255,255,0.15);
color:white;
}

.input-group input::placeholder{
color:#ddd;
}

.input-group input:focus{
box-shadow:0 0 8px #00c6ff;
}

/* LOGIN BUTTON */

.login-btn{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
font-size:16px;
font-weight:600;
background:linear-gradient(90deg,#00c6ff,#0072ff);
color:white;
cursor:pointer;
transition:0.3s;
}

.login-btn:hover{
transform:scale(1.05);
box-shadow:0 5px 20px rgba(0,0,0,0.5);
}

.blink{
text-align:center;
margin-top:15px;
font-size:13px;
opacity:0.8;
animation:blinkText 2s infinite;
}

@keyframes blinkText{
0%{opacity:1}
50%{opacity:0.3}
100%{opacity:1}
}

</style>

</head>

<body>

<div class="login-box">

<h2>Budget App Login</h2>

<form action="/budgetApp/login" method="post">

<div class="input-group">
<label>Username</label>
<input type="text" name="username" required>
</div>

<div class="input-group">
<label>Password</label>
<input type="password" name="password" required>
</div>

<button class="login-btn" type="submit">Login</button>

</form>

<p class="blink">Secure Budget Management System</p>

</div>

</body>
</html>
