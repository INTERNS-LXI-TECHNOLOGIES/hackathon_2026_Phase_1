<!DOCTYPE html>
<html>
<head>
<title>List By Amount</title>

<style>
body{
font-family:'Poppins',sans-serif;
background:#0f2027;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
width:600px;
background:rgba(255,255,255,0.1);
padding:30px;
border-radius:15px;
backdrop-filter:blur(10px);
box-shadow:0 8px 20px rgba(0,0,0,0.5);
}

h2{
text-align:center;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
}

th, td{
padding:12px;
text-align:left;
}

th{
background:#00c9ff;
color:black;
}

tr{
border-bottom:1px solid rgba(255,255,255,0.2);
}

tr:hover{
background:rgba(255,255,255,0.1);
}
</style>

</head>

<body>

<div class="container">

<h2>Transactions (By Amount)</h2>

<table>
<tr>
<th>Description</th>
<th>Amount</th>
</tr>

<tr th:each="t : ${transactions}">
<td th:text="${t}"></td>
<td>-</td>
</tr>

</table>

</div>

</body>
</html>
