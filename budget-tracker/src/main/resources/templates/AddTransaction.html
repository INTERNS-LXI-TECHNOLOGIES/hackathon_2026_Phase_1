<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title th:text="#{add.transaction}">Add Transaction</title>

<style>

body{
font-family:Arial;
background:#1a1a1a;
color:#e0e0e0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
background:#2d2d2d;
padding:30px;
width:400px;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,0.3);
border:1px solid #404040;
}

h2{
text-align:center;
margin-bottom:20px;
color:#4ade80;
}

input,select{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:15px;
border-radius:6px;
border:1px solid #555;
background-color:#404040;
color:#e0e0e0;
}

input:focus,select:focus{
outline:none;
border-color:#22c55e;
}

button{
width:100%;
padding:12px;
background:#22c55e;
color:white;
border:none;
border-radius:6px;
font-size:16px;
cursor:pointer;
border:1px solid #16a34a;
}

button:hover{
background:#16a34a;
}

</style>
</head>

<body>

<div class="card">

<h2 th:text="#{add.transaction}">Add Transaction</h2>

<form th:action="@{/addTransaction}" method="post">

<label th:text="#{transaction.description}">Desc</label>
<input type="text" name="desc" required>

<label th:text="#{transaction.amount}">Amt</label>
<input type="number" name="amt" step="0.01" required>

<label th:text="#{transaction.category}">Cat</label>
<input type="text" name="cat" required>

<label th:text="#{transaction.type}">Type</label>
<select name="type" required>
<option value="INCOME" th:text="#{transaction.type.income}">INCOME</option>
<option value="EXPENSE" th:text="#{transaction.type.expense}">EXPENSE</option>
</select>

<button type="submit" th:text="#{add.transaction.button}">Add Transaction</button>

</form>
</div>

</body>
</html>
